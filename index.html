<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tautan</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#6b7280;
  --primary:#2563eb; --primary-d:#1d4ed8; --border:#e5e7eb;
  --chip:#eef2ff; --chip-on:#2563eb;
}
body.dark{
  --bg:#0f1420; --card:#1a2233; --text:#e8ecf4; --muted:#9aa3b5;
  --primary:#60a5fa; --primary-d:#3b82f6; --border:#2b3550;
  --chip:#1e2a45; --chip-on:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.35rem}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.iconbtn{background:var(--card);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:1.2rem;cursor:pointer;color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:1rem;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
select.sel{padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:.92rem;background:var(--bg);color:var(--text);max-width:190px;cursor:pointer;flex:none}
select.sel:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.sheetlabel{font-size:.8rem;color:var(--muted);align-self:center;white-space:nowrap}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar input{flex:1}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:10px 14px;font-size:.9rem;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{color:var(--primary);border-color:var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chip{background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:.88rem;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--primary)}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff;font-weight:700}
.chip small{opacity:.75;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
a.tbtn{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-decoration:none;color:var(--text);transition:transform .12s,box-shadow .12s,border-color .12s}
a.tbtn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1);border-color:var(--primary)}
.fav{width:40px;height:40px;flex:none;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden}
.fav img{width:28px;height:28px}
.tbody{min-width:0}
.tname{font-weight:700;font-size:.98rem;line-height:1.3}
.tdesc{font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tdom{font-size:.72rem;color:var(--primary);margin-top:5px;word-break:break-all}
.tcat{display:inline-block;font-size:.68rem;background:var(--chip);border-radius:999px;padding:2px 9px;margin-top:6px;color:var(--muted)}
.count{font-size:.82rem;color:var(--muted);margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.92rem}
.alert.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
body.dark .alert.err{background:#3f1d1d;color:#fca5a5}
body.dark .alert.warn{background:#3a2c10;color:#fcd34d}
.loading{text-align:center;padding:24px;color:var(--muted)}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-5px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin:22px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🔗 Tautan</h1>
      <div class="sub">Kumpulan tautan berdasarkan kategori</div>
    </div>
    <button class="iconbtn" id="themeBtn" title="Mode terang/gelap">🌙</button>
  </header>

  <div id="cfgWarn" class="alert warn" style="display:none">⚠️ <b>Belum disambungkan.</b> Tempel Web App URL ke konstanta <b>WEBAPP_URL</b> di file ini (lihat PANDUAN.txt).</div>
  <div id="msg"></div>

  <div class="card">
    <div class="toolbar">
      <span class="sheetlabel" id="sheetLabel">📑 Sumber:</span>
      <select id="sheetSel" class="sel" title="Pilih daftar (nama sheet)"></select>
      <input type="text" id="q" placeholder="Cari tautan…" autocomplete="off">
      <button class="btn-ghost" id="reloadBtn">🔄 Muat ulang</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>Dikembangkan oleh Wartam - SMP Negeri 4 Majenang</footer>
</div>

<script>
/* ===== KONFIGURASI — tempel Web App URL dari Deploy Apps Script di sini ===== */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby-8cvXvjwuTuSBx3cjQoyhyoO6QRPvnY6gAIilbB7KLJ_Py88ag5dRKYLrt1_0dBSGrQ/exec";
/* =========================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let DATA = [];
let activeCat = '';
let SHEETS = [];
let activeSheet = '';
let fromCache = false; // true saat yang tampil masih data simpanan

/* ---------- cache (localStorage) ---------- */
function cacheGet(key){
  try{
    const o = JSON.parse(localStorage.getItem(key));
    if(o && o.data) return o;
  }catch(e){}
  return null;
}
function cacheSet(key, data){
  try{ localStorage.setItem(key, JSON.stringify({ t: Date.now(), data: data })); }catch(e){}
}
const dataKey = () => 'tk_data_' + (activeSheet || 'default');

function pickSheet(bawaan){
  const saved = localStorage.getItem('tk_sheet');
  return SHEETS.indexOf(saved) >= 0 ? saved : (bawaan || SHEETS[0]);
}

/* ---------- tema ---------- */
const themeBtn = $('themeBtn');
function setTheme(t){ document.body.classList.toggle('dark', t==='dark'); themeBtn.textContent = t==='dark'?'☀️':'🌙'; localStorage.setItem('tk_theme', t); }
setTheme(localStorage.getItem('tk_theme') || 'light');
themeBtn.onclick = () => setTheme(document.body.classList.contains('dark') ? 'light' : 'dark');

/* ---------- pesan ---------- */
function showMsg(html, type){ $('msg').innerHTML = html ? '<div class="alert '+type+'">'+html+'</div>' : ''; }

/* ---------- api ---------- */
async function apiGet(qs){
  const r = await fetch(WEBAPP_URL + '?' + qs);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---------- pemilih sheet ---------- */
function fillSheetSel(){
  const sel = $('sheetSel');
  sel.innerHTML = SHEETS.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
  sel.value = activeSheet;
  sel.onchange = () => {
    activeSheet = sel.value;
    localStorage.setItem('tk_sheet', activeSheet);
    $('q').value = '';
    activeCat = '';
    loadSheet(true);
  };
}

function hideSheetSel(){
  $('sheetSel').style.display = 'none';
  $('sheetLabel').style.display = 'none';
}

/* Ambil daftar sheet dulu (pakai cache bila ada), lalu muat datanya.
   Kompatibel mundur: bila backend lama (tanpa aksi 'sheets'),
   pemilih sheet disembunyikan dan perilaku seperti semula. */
async function init(){
  if(!WEBAPP_URL){ $('cfgWarn').style.display='block'; return; }
  $('cfgWarn').style.display='none';
  const cs = cacheGet('tk_sheets');
  if(cs && cs.data.length){
    SHEETS = cs.data;
    activeSheet = pickSheet(null);
    fillSheetSel();
  }
  try{
    const s = await apiGet('action=sheets');
    if(s && s.ok && Array.isArray(s.sheets) && s.sheets.length){
      SHEETS = s.sheets;
      cacheSet('tk_sheets', SHEETS);
      activeSheet = pickSheet(s.bawaan);
      fillSheetSel();
    } else if(!SHEETS.length){
      hideSheetSel();
    }
  }catch(e){
    if(!SHEETS.length) hideSheetSel();
  }
  loadSheet(true);
}

/* Muat data satu sheet: tampilkan cache dulu (instan),
   lalu perbarui dari server di belakang layar. */
async function loadSheet(useCache){
  fromCache = false;
  if(useCache){
    const c = cacheGet(dataKey());
    if(c && c.data.length){
      DATA = c.data;
      fromCache = true;
      activeCat = '';
      renderChips();
      render();
    }
  }
  if(!fromCache){
    showMsg('<div class="alert"><div class="loading"><span class="spinner"></span>Memuat daftar tautan…</div></div>', '');
    $('grid').innerHTML = '';
    $('chips').innerHTML = '';
  }
  try{
    const qs = SHEETS.length ? 'action=list&sheet=' + encodeURIComponent(activeSheet) : 'action=list';
    const d = await apiGet(qs);
    if(!d.ok) throw new Error(d.msg || 'Respons tidak valid');
    if(d.sheet) activeSheet = d.sheet;
    DATA = d.tautan || [];
    fromCache = false;
    cacheSet(dataKey(), DATA);
    if(!DATA.length){
      const g = d.debug || {};
      const sheetInfo = activeSheet ? ' pada tab "<b>' + esc(activeSheet) + '</b>"' : '';
      showMsg('⚠️ <b>Belum ada tautan yang terbaca' + sheetInfo + '.</b><br><small>' +
        'Isi tab dengan kolom: Kategori | Nama | URL | Keterangan ' +
        '(atau jalankan ulang SetupTemplate untuk contoh di tab "Tautan"). ' +
        (g.barisJudul ? 'Baris judul ke-'+g.barisJudul+', '+g.barisData+' baris data terbaca.' : '') +
        '</small>', 'warn');
    } else showMsg('');
    activeCat = '';
    renderChips();
    render();
  }catch(e){
    fromCache = false;
    if(!DATA.length){
      // tidak ada cache sama sekali -> tampilkan error
      showMsg('❌ <b>Gagal memuat:</b> ' + esc(e.message) + ' — periksa Web App URL & koneksi.', 'err');
    } else {
      // cache tetap tampil; perbarui tulisan jumlah tanpa indikator
      render();
    }
    // kegagalan refresh saat cache tampil diabaikan diam-diam
  }
}

/* ---------- kategori ---------- */
function categories(){
  const seen = [], out = [];
  DATA.forEach(t => {
    const c = (t.kategori || '').trim() || 'Lainnya';
    if(!seen.includes(c)){ seen.push(c); out.push(c); }
  });
  return out;
}

function renderChips(){
  const cats = categories();
  const box = $('chips');
  let html = '<button class="chip' + (activeCat==='' ? ' on' : '') + '" data-c="">Semua <small>' + DATA.length + '</small></button>';
  html += cats.map(c => {
    const n = DATA.filter(t => ((t.kategori||'').trim() || 'Lainnya') === c).length;
    return '<button class="chip' + (activeCat===c ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + ' <small>' + n + '</small></button>';
  }).join('');
  box.innerHTML = html;
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => { activeCat = b.dataset.c; renderChips(); render(); });
}

/* ---------- daftar ---------- */
function hostOf(url){
  try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; }
}

function render(){
  const kw = $('q').value.trim().toLowerCase();
  const list = DATA.filter(t => {
    const c = (t.kategori || '').trim() || 'Lainnya';
    if(activeCat && c !== activeCat) return false;
    if(kw && !(t.nama + ' ' + t.url + ' ' + (t.keterangan||'')).toLowerCase().includes(kw)) return false;
    return true;
  });
  $('count').textContent = list.length + ' tautan ditampilkan' + (activeCat ? ' • ' + activeCat : '') + (fromCache ? ' • memperbarui…' : '');
  if(!list.length){
    $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">🔍 Tidak ada tautan yang cocok.</div>';
    return;
  }
  $('grid').innerHTML = list.map(t => {
    const host = hostOf(t.url);
    const fav = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64';
    const cat = (t.kategori || '').trim() || 'Lainnya';
    return '<a class="tbtn" href="' + esc(t.url) + '" target="_blank" rel="noopener">' +
      '<span class="fav"><img src="' + esc(fav) + '" alt="" loading="lazy" onerror="this.remove()"><span>🔗</span></span>' +
      '<span class="tbody"><span class="tname">' + esc(t.nama || host) + '</span>' +
      (t.keterangan ? '<span class="tdesc">' + esc(t.keterangan) + '</span>' : '') +
      '<span class="tdom">' + esc(host) + '</span><br><span class="tcat">' + esc(cat) + '</span></span>' +
      '</a>';
  }).join('');
}

$('q').addEventListener('input', render);
$('reloadBtn').onclick = () => loadSheet(false); // paksa muat baru dari server
init();
</script>
</body>
</html>
